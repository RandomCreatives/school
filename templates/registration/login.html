{% extends "base.html" %}
{% block title %}Log in · School{% endblock %}
{% block content %}
<div class="card" style="max-width: 22rem; margin: 3rem auto;">
  <h1>Log in</h1>
  {% if form.errors %}
    <p class="notice">Wrong username or password — please try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Username<br>{{ form.username }}</label></p>
    <p><label>Password<br>{{ form.password }}</label></p>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
